name: ritmo
description: "Aplicativo pessoal, local-first e offline para acompanhar o cumprimento diário."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  drift: 2.34.3
  flutter_local_notifications: 22.2.0
  flutter_markdown: 0.7.7+1
  markdown: 7.3.1
  go_router: 17.4.0
  just_audio: 0.10.6
  riverpod: 3.3.2
  sqlite3_flutter_libs: 0.6.0+eol
  timezone: 0.11.1
  path_provider: 2.1.6
  path: 1.9.1
  flutter_riverpod: 3.3.2

dev_dependencies:
  analyzer: 12.1.0
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  glados: 1.1.7
  riverpod_generator: 4.0.4
  build_runner: 2.15.1
  drift_dev: 2.34.0
  sqlite3: 3.5.1

flutter:
  uses-material-design: true
  assets:
    - assets/manifesto/manifesto.md
