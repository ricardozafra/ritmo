name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Análise, lints e testes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter 3.44.8 (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8
          channel: stable
          cache: true

      - name: Resolver dependências
        run: flutter pub get

      - name: Verificar formatação
        run: dart format --output=none --set-exit-if-changed .

      - name: Análise estática
        run: flutter analyze --no-pub

      - name: Lint do relógio operacional
        run: dart run tool/clock_lint.dart

      - name: Verificação de escopo do MVP
        run: dart run tool/mvp_scope_check.dart

      - name: Testes
        run: flutter test --no-pub --concurrency=1
